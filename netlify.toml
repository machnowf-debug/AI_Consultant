# ============================================================
#  florianmachnow.de  ·  Netlify-Konfiguration
#  Statische Website, kein Buildschritt noetig.
# ============================================================

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = true

# ------------------------------------------------------------
#  Globale Header
#  X-Robots-Tag haelt die Seite zuverlaessig aus Suchmaschinen,
#  auch dann, wenn robots.txt ignoriert wird.
# ------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Kein 'unsafe-inline' und kein Hash: die Seiten enthalten kein
    # einziges Inline-Script mehr. Bleibt es dabei, kann an dieser Stelle
    # auch nichts mehr stillschweigend blockiert werden.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://app.cal.com https://cal.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://app.cal.com https://cal.com; frame-src https://app.cal.com https://cal.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# Bilder tragen stabile Namen und aendern sich praktisch nie.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS und JS aendern sich bei jedem Umbau. Sie duerfen NICHT als
# "immutable" ausgeliefert werden: Browser fragen dann ein Jahr lang
# nicht mehr nach und zeigen Besuchern, die schon einmal da waren,
# dauerhaft die alte Fassung. Beide Dateien sind klein, taegliche
# Rueckfragen kosten nichts.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ------------------------------------------------------------
#  Saubere URLs
# ------------------------------------------------------------
[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 200

[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz.html"
  status = 200

[[redirects]]
  from = "/danke"
  to = "/danke.html"
  status = 200

[[redirects]]
  from = "/kontakt"
  to = "/#termin"
  status = 301
